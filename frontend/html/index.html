<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant - Automation Center</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Glassmorphic Background Shapes -->
    <div class="blob blob-purple"></div>
    <div class="blob blob-blue"></div>

    <div class="app-container">
        <!-- Top Status Bar Container -->
        <header class="top-bar glass" id="header-container"></header>

        <!-- Main Dashboard Layout -->
        <main class="dashboard-grid">
            <!-- Left Panel Container (Input, Suggestions, Extracted Analysis) -->
            <section class="left-panel" id="left-panel-container"></section>

            <!-- Right Panel Container (Active Reminder Queue) -->
            <section class="right-panel" id="right-panel-container"></section>
        </main>
    </div>

    <!-- SSE Floating Notification Toast Overlay -->
    <div class="notification-container" id="toast-container"></div>

    <!-- Main JS ES6 Module Entry Point -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
